<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Estudiante · Ecosistema Educativo</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/modulos/registro.css">
</head>
<body>
  <div id="plantilla"></div>
  <main id="contenido" class="contenedor registro-contenedor">
    <div class="tarjeta registro-tarjeta">
      <h1>Crear Cuenta de Estudiante</h1>
      <p>Regístrate para acceder a los contenidos, cursos y actividades formativas.</p>

      <form id="formRegistro" class="pila" novalidate>
        <div class="grid-auto">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Andrea" required>
            <span id="errorNombre" class="campo__error oculto"></span>
          </div>

          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ej. Solís" required>
            <span id="errorApellido" class="campo__error oculto"></span>
          </div>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email" placeholder="andrea@unemi.edu.ec" required>
          <span id="errorCorreo" class="campo__error oculto"></span>
        </div>

        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" name="clave" autocomplete="new-password" placeholder="Mínimo 8 caracteres (letras y números)" required>
          <span id="errorClave" class="campo__error oculto"></span>
        </div>

        <div class="campo">
          <label class="casilla-privacidad">
            <input type="checkbox" id="consentimiento" name="consentimiento" required>
            <span>
              Acepto el <a href="/paginas/privacidad.html" target="_blank" rel="noopener">aviso de privacidad</a>
              y el tratamiento de mis datos personales según la LOPDP.
            </span>
          </label>
          <span id="errorConsentimiento" class="campo__error oculto"></span>
        </div>

        <button type="submit" class="btn btn--primario" id="btnRegistrar">
          Crear cuenta e ingresar
        </button>

        <p style="text-align: center; margin-top: var(--espacio-s);">
          <small>
            ¿Ya tienes una cuenta registrada?
            <a href="/paginas/ingreso.html">Inicia sesión</a>
          </small>
        </p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/modulos/registro.js"></script>
</body>
</html>

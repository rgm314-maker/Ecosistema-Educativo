<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Tareas · Ecosistema Educativo</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/componentes.css"><link rel="stylesheet" href="/css/modulos/tareas.css"></head>
<body><div id="plantilla"></div><main id="contenido" class="contenedor pila">
<header class="tareas__cabecera"><div><h1>Tareas</h1><p class="texto-suave">Actividades con fecha límite y entrega de archivos.</p></div><button id="nueva-tarea" class="btn btn--primario oculto" type="button">Nueva tarea</button></header>
<section id="lista-tareas" class="tareas__lista" aria-live="polite"></section>
<dialog id="modal-tarea" class="modal-dialog"><form id="form-tarea" class="pila"><h2>Nueva tarea</h2>
<label class="campo"><span>Grupo</span><select id="grupo" required></select></label>
<label class="campo"><span>Título</span><input id="titulo" maxlength="160" required></label>
<label class="campo"><span>Descripción</span><textarea id="descripcion" rows="6" maxlength="5000" required></textarea></label>
<label class="campo"><span>Fecha límite</span><input id="fecha-limite" type="datetime-local" required></label>
<label class="campo"><span>Archivo de apoyo (opcional)</span><input id="archivo-tarea" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.webp,.mp3"></label>
<div class="modal-acciones"><button id="cancelar-tarea" class="btn btn--secundario" type="button">Cancelar</button><button class="btn btn--primario" type="submit">Publicar tarea</button></div>
</form></dialog></main><script type="module" src="/js/modulos/tareas.js"></script></body></html>

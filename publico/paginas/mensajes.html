<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Mensajes · Ecosistema Educativo</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/componentes.css"><link rel="stylesheet" href="/css/modulos/mensajes.css"></head>
<body><div id="plantilla"></div><main id="contenido" class="contenedor mensajes">
<section class="tarjeta mensajes__lateral" aria-label="Conversaciones"><header class="mensajes__cabecera"><h1>Mensajes</h1><div class="mensajes__acciones"><button id="difusion" class="btn btn--secundario btn--pequeno oculto" type="button">Mensaje al curso</button><button id="nueva-conversacion" class="btn btn--primario btn--pequeno" type="button">Nueva conversación</button></div></header>
<label class="campo"><span>Buscar conversaciones</span><input id="buscar" type="search" autocomplete="off" placeholder="Nombre o mensaje"></label><div id="conversaciones" class="conversaciones" aria-live="polite"></div></section>
<section id="panel-chat" class="tarjeta mensajes__chat" aria-label="Conversación"><header class="chat__cabecera"><button id="volver" class="btn btn--secundario btn--pequeno chat__volver" type="button">← Volver</button><div class="chat__identidad"><h2 id="nombre-contacto">Selecciona una conversación</h2><p id="detalle-contacto" class="texto-suave"></p></div><button id="alternar-bloqueo" class="btn btn--secundario btn--pequeno oculto" type="button">Bloquear</button></header>
<button id="anteriores" class="btn btn--texto oculto" type="button">Ver anteriores</button><div id="mensajes" class="chat__mensajes" aria-live="polite"><div class="vacio"><p>Elige una conversación para comenzar.</p></div></div>
<form id="form-mensaje" class="chat__form oculto"><label class="sr-only" for="texto-mensaje">Mensaje</label><textarea id="texto-mensaje" rows="2" maxlength="2000" placeholder="Escribe un mensaje" required></textarea><div class="chat__envio"><small id="contador">0 / 2.000</small><button class="btn btn--primario" type="submit">Enviar</button></div></form></section>
<dialog id="modal-contactos" class="modal-dialog"><div class="pila"><h2>Nueva conversación</h2><label class="campo"><span>Buscar contacto</span><input id="buscar-contacto" type="search" autocomplete="off"></label><div id="contactos" class="contactos"></div><div class="modal-acciones"><button id="cerrar-contactos" class="btn btn--secundario" type="button">Cancelar</button></div></div></dialog>
<dialog id="modal-difusion" class="modal-dialog"><form id="form-difusion" class="pila"><h2>Mensaje al curso</h2><label class="campo"><span>Grupo</span><select id="grupo-difusion" required></select></label><label class="campo"><span>Mensaje</span><textarea id="texto-difusion" rows="5" maxlength="2000" required></textarea></label><div class="modal-acciones"><button id="cerrar-difusion" class="btn btn--secundario" type="button">Cancelar</button><button class="btn btn--primario" type="submit">Enviar al curso</button></div></form></dialog>
</main><script type="module" src="/js/modulos/mensajes.js"></script></body></html>
